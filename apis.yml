aid: snackmagic
name: SnackMagic
description: >-
  SnackMagic is a 100% customizable snack-box gifting service, now part of Stadium, that
  lets recipients build their own box from 500+ snacks and beverages or receive curated
  gifts, delivered worldwide. Companies use it for employee, client, prospect, and event
  gifting. SnackMagic is exposed to developers through the Stadium API (api.bystadium.com),
  a JSON REST API for embedding a global gift, rewards, and branded-swag catalog, placing
  orders funded by a pre-purchased Wallet balance, sending Stadium Shop points via treat
  links, and triggering webhook-automation gift orders. This profile was enriched from the
  provider's public OpenAPI and developer surface.
