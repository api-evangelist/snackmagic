servers:
  - url: https://api.bystadium.com/api/v2
    description: Default server
  - url: https://api.preprod.bystadium.com/api/v2
    description: Sandbox server
info:
  description: |
    ### *Stadium’s API can only be used by customers and partners on the Business and Enterprise Packages. See [here](https://www.bystadium.com/pricing) for more details.

    # Introduction

    Stadium's API lets you embed a global gift, rewards, and branded swag catalog on your own native application.

    You can also embed a unique treat link to send Stadium Shop points for your users to redeem gifts, rewards and swag, on Stadium.

    - Pull in and display your unique Stadium Shop products.
    - Place orders against your Stadium Shop from your website or app, and pass on fulfillment to Stadium.
    - Send Stadium Shop points via our secure treat link for users to redeem gifts, rewards and branded swag to your branded Stadium Shop, on Stadium. This replicates our send points flow without having to generate an admin/organizer order from Stadium.

    # Getting started

    To start using the API, you'll need to set up a shop against which you would be placing orders.

    To set up a shop:

    1. Sign up for a **free** Stadium account at: https://www.bystadium.com/. See Login/Sign Up in the top right corner of the page.
    2. Create your **free** Stadium Shop signup for an account at **Stadium** and create as many shops as you desire. [Video demo link](https://youtu.be/VAMfQMHqVmY)
    3. Once you have set up the shop, edit your shop catalog on the Stadium Shop’s dashboard so that you curate and approve all SKUs you are making available from our master catalog. [Video demo link](https://youtu.be/DEY1N2bBYtw)
    4. Set up your funding source. Because there will be no checkout page to pay for orders on Stadium’s front-end website, API users must deposit Wallet funds which can be used as a pre-purchased balance to pay for orders every time a recipient redeems Stadium products on a third-party platform. [More details here](https://www.bystadium.com/wallet)
    5. Once you have created an account, set up your shop, finalized your catalog, and set up a funding source, reach out to our support at engineering@bystadium.com and we'll provide you with access credentials which can be used to generate tokens and make API requests.


    # Environments

    Stadium's API has two environments:

    - **Production**
      https://api.bystadium.com

    - **Sandbox**
      https://api.preprod.bystadium.com


    # Sandbox

    You can use the Sandbox environment to create test orders without being charged for them. Your sandbox account
    is entirely separate account from production, so you can do your testing without affecting your main account.

    To setup a sandbox account, please email engineering@bystadium.com for basic credentials. Once you receive those
    to access the sandbox environment, you can create a test user account and Stadium Shop by signing up on
    https://preprod.bystadium.com/shops/all

    Once done, reach out to our support at engineering@bystadium.com and we’ll help you get started with API keys.
